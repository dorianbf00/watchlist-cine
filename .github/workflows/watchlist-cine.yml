name: Watchlist au cinéma

on:
  schedule:
    # Toutes les heures de 4h à 22h UTC (5h-23h à Paris), sans notif : le Rétro Projecteur publie les
    # programmes au fil de la journée (la semaine ciné du mercredi arrive le mardi), un seul passage à
    # l'aube ratait donc les films ajoutés ensuite.
    - cron: "7 4-22 * * *"
    - cron: "0 8 */3 * *"   # 8h UTC (9h/10h à Paris), les 1, 4, 7, 10… du mois : mise à jour + notif
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main, ou "tirer pour actualiser" (relais Cloudflare)
    inputs:
      source:
        description: "manuel = avec notif ; app = tirer pour actualiser, sans notif"
        default: manuel
  push:                      # chaque modif du code republie la page (sans notif)
    branches: [main]

permissions:
  contents: write   # pour le petit commit anti-mise-en-veille
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Génération + publication sur la même machine (une 2e machine "deploy" coûtait ~20 s de démarrage)
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    env:
      TZ: Europe/Paris
      LETTERBOXD_USER: vertpisse00
    steps:
      - uses: actions/checkout@v4

      # Cache des fiches Letterboxd déjà trouvées (affiches des autres films) : évite de tout rechercher à chaque passage
      - uses: actions/cache@v4
        with:
          path: |
            lb-cache.json
            lb-films.json
            taste-data.json
            film-info.json
          key: lb-cache-${{ github.run_id }}
          restore-keys: lb-cache-

      - name: Générer la page
        shell: pwsh
        run: |
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLower(); $repo = $env:GITHUB_REPOSITORY.Split('/')[1]
          New-Item -ItemType Directory -Force site | Out-Null
          Copy-Item app/* site/
          ./watchlist-cine.ps1 -User $env:LETTERBOXD_USER -OutDir site -NoOpen `
            -PageUrl "https://$owner.github.io/$repo/" -NotifOut "$env:RUNNER_TEMP/notif.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Dans le même job, l'artefact tout juste envoyé n'est parfois pas encore visible
      # ("No artifacts named github-pages") : on retente une fois quelques secondes plus tard.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: notif
          path: ${{ runner.temp }}/notif.json
          retention-days: 3

      # GitHub met en pause les tâches planifiées d'un dépôt public après 60 jours sans commit :
      # on fait un commit vide de temps en temps pour l'éviter.
      - name: Rester actif
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Rester actif"
            git push
          fi

  notify:
    needs: build
    # Notif : lancement manuel (pas le tirer pour actualiser), ou passage planifié "tous les 3 jours" (pas la mise à jour quotidienne ni les modifs de code)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.source != 'app') || github.event.schedule == '0 8 */3 * *' }}
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notif
      - name: Notification téléphone (ntfy)
        if: ${{ env.NTFY_TOPIC != '' }}
        run: |
          jq --arg t "$NTFY_TOPIC" '. + {topic: $t}' notif.json \
            | curl -sf -H "Content-Type: application/json" --data-binary @- https://ntfy.sh/ > /dev/null
          echo "Notification envoyée"
      # Notif Web Push (icône de l'appli) : le relais Cloudflare l'envoie à chaque téléphone abonné depuis la page
      - name: Notification téléphone (Web Push)
        if: ${{ env.PUSH_SECRET != '' }}
        run: |
          curl -sSf -X POST -H "Authorization: Bearer $PUSH_SECRET" -H "Content-Type: application/json" \
            --data-binary @notif.json https://watchlist-refresh.doriansublon.workers.dev/push/send
          echo
