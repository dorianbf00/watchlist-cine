name: Watchlist au cinéma

on:
  schedule:
    - cron: "0 8 */3 * *"   # 8h UTC (9h/10h à Paris), les 1, 4, 7, 10… du mois
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write   # pour le petit commit anti-mise-en-veille
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      LETTERBOXD_USER: vertpisse00
    steps:
      - uses: actions/checkout@v4

      - name: Générer la page
        shell: pwsh
        run: |
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLower(); $repo = $env:GITHUB_REPOSITORY.Split('/')[1]
          New-Item -ItemType Directory -Force site | Out-Null
          ./watchlist-cine.ps1 -User $env:LETTERBOXD_USER -OutDir site -NoOpen `
            -PageUrl "https://$owner.github.io/$repo/" -NotifOut "$env:RUNNER_TEMP/notif.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: notif
          path: ${{ runner.temp }}/notif.json
          retention-days: 3

      # GitHub met en pause les tâches planifiées d'un dépôt public après 60 jours sans commit :
      # on fait un commit vide de temps en temps pour l'éviter.
      - name: Rester actif
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Rester actif"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notif
      - name: Notification téléphone (ntfy)
        if: ${{ env.NTFY_TOPIC != '' }}
        run: |
          jq --arg t "$NTFY_TOPIC" '. + {topic: $t}' notif.json \
            | curl -sf -H "Content-Type: application/json" --data-binary @- https://ntfy.sh/ > /dev/null
          echo "Notification envoyée"
