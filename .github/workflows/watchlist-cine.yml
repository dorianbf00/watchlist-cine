name: Watchlist au cinéma

on:
  schedule:
    - cron: "0 4 * * *"     # tous les jours à 4h UTC (5h/6h à Paris) : page à jour, 7 jours glissants, sans notif
    - cron: "0 8 */3 * *"   # 8h UTC (9h/10h à Paris), les 1, 4, 7, 10… du mois : mise à jour + notif
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main
  push:                      # chaque modif du code republie la page (sans notif)
    branches: [main]

permissions:
  contents: write   # pour le petit commit anti-mise-en-veille
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
      LETTERBOXD_USER: vertpisse00
    steps:
      - uses: actions/checkout@v4

      # Cache des fiches Letterboxd déjà trouvées (affiches des autres films) : évite de tout rechercher à chaque passage
      - uses: actions/cache@v4
        with:
          path: |
            lb-cache.json
            lb-films.json
            taste-data.json
          key: lb-cache-${{ github.run_id }}
          restore-keys: lb-cache-

      - name: Générer la page
        shell: pwsh
        run: |
          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLower(); $repo = $env:GITHUB_REPOSITORY.Split('/')[1]
          New-Item -ItemType Directory -Force site | Out-Null
          Copy-Item app/* site/
          ./watchlist-cine.ps1 -User $env:LETTERBOXD_USER -OutDir site -NoOpen `
            -PageUrl "https://$owner.github.io/$repo/" -NotifOut "$env:RUNNER_TEMP/notif.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: notif
          path: ${{ runner.temp }}/notif.json
          retention-days: 3

      # GitHub met en pause les tâches planifiées d'un dépôt public après 60 jours sans commit :
      # on fait un commit vide de temps en temps pour l'éviter.
      - name: Rester actif
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Rester actif"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    # Notif : lancement manuel, ou passage planifié "tous les 3 jours" (pas la mise à jour quotidienne ni les modifs de code)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 */3 * *' }}
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notif
      - name: Notification téléphone (ntfy)
        if: ${{ env.NTFY_TOPIC != '' }}
        run: |
          jq --arg t "$NTFY_TOPIC" '. + {topic: $t}' notif.json \
            | curl -sf -H "Content-Type: application/json" --data-binary @- https://ntfy.sh/ > /dev/null
          echo "Notification envoyée"
