<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchlist au ciné</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#030303" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ciné">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Inter:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
<style>
/* Direction artistique : blanc / noir pour les fonds + les 2 couleurs du logo officiel (Figma, frame 11)
   - jaune-vert du W (#D5FF00 -> #F6FF00) : ce qui est À TOI ou SÉLECTIONNÉ (logo, jour choisi, "Vu", watchlist)
   - bleu électrique (#0033FF)          : ACTIONS et RECOMMANDATIONS (horaires, filtres, "87 %", "Aussi à l'affiche")
   - dégradé jaune-vert -> fond de page : signature, réservé au geste "tirer pour actualiser" */
:root {
  --bg: #ffffff; --ink: #030303; --gray: #6a6a6d; --gray-t: #6a6a6d99;
  --lime-1: #D5FF00; --lime-2: #F6FF00; --lime: #E6FF00; --lime-grad: linear-gradient(180deg, var(--lime-1), var(--lime-2));
  --elec: #0033FF; --elec-grad: linear-gradient(180deg, #2B5BFF, #0033FF); --elec-text: #0033FF; --on-elec: #ffffff;
  --green: var(--lime); --green-pale: #E6FF0026; --blue: var(--elec); --blue-pale: #0033FF0D; --red: #ff4d4d;
  --line: #6a6a6d; --hair: #d9d9db; --on-green: #6a6a6d;
  --display: "Archivo", "Arial Black", sans-serif; --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #030303; --ink: #f4f4f2; --gray: #a5a5a8; --gray-t: #a5a5a899; --line: #6a6a6d; --hair: #29292b; --green-pale: #D5FF0017; --blue-pale: #3355FF24; --elec-text: #7B93FF; }
}
:root[data-theme="dark"] { --bg: #030303; --ink: #f4f4f2; --gray: #a5a5a8; --gray-t: #a5a5a899; --line: #6a6a6d; --hair: #29292b; --green-pale: #D5FF0017; --blue-pale: #3355FF24; --elec-text: #7B93FF; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--sans); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
.display { font-family: var(--display); font-weight: 900; font-stretch: 112%; text-transform: uppercase; letter-spacing: -.01em; }
.up { text-transform: uppercase; }

/* En-tête */
.masthead { padding-top: calc(16px + env(safe-area-inset-top)); }
.kicker { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; font-weight: 500; color: var(--gray); text-transform: uppercase; letter-spacing: .02em; padding-bottom: 10px; }
.kicker a { text-decoration: none; border-bottom: 1px solid currentColor; }
/* Logo W au centre (remplace le bandeau "WATCHLIST") */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.logo-wrap { margin: 6px 0 2px; display: flex; justify-content: center; perspective: 700px; }
.logo { width: 64px; height: auto; display: block; transform-style: preserve-3d; will-change: transform;
  filter: drop-shadow(0 6px 14px #C8F00038); }
/* Tirer pour actualiser */
html, body { overscroll-behavior-y: none; }
#app { position: relative; z-index: 1; background: var(--bg); }
/* Le dégradé est étiré (scaleY, sur la carte graphique) pour toujours finir au bord de la page tirée */
.ptr-sky { position: fixed; z-index: 0; top: 0; left: 0; right: 0; height: 140px; pointer-events: none;
  transform-origin: top; transform: scaleY(0); will-change: transform;
  background: linear-gradient(180deg, var(--lime-1), var(--lime-2) 18%, var(--bg));
  background: linear-gradient(in oklab 180deg, var(--lime-1), var(--lime-2) 18%, color-mix(in oklab, var(--lime-2) 55%, var(--bg)) 55%, var(--bg)); }
.ptr-sky.ptr-anim { transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
#app.ptr-live { will-change: transform; }
#app.ptr-live, #app.ptr-anim { border-radius: 22px 22px 0 0; box-shadow: 0 -10px 28px #9EBF0040; }
#app.ptr-anim { transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
#app.ptr-anim .logo { transition: transform .7s cubic-bezier(.2, .8, .2, 1); }
html.ptr-busy #app .logo { transition: transform 1s cubic-bezier(.35, .1, .25, 1); }
/* Mise à jour en cours (2-3 min) : le W tourne en continu, la page reste entrouverte sur le dégradé */
html.ptr-wait #app .logo { transition: none; animation: ptr-spin 1.4s linear infinite; }
@keyframes ptr-spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
html.ptr-wait .ptr-hint { animation: ptr-breathe 1.6s ease-in-out infinite; }
@keyframes ptr-breathe { 50% { opacity: .55; } }
.ptr-hint { position: fixed; z-index: 4; top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0; text-align: center; pointer-events: none;
  font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #030303a6; opacity: 0; transition: opacity .2s; }
html.ptr-pulling .ptr-hint, html.ptr-busy .ptr-hint { opacity: 1; }
html.ptr-ready .ptr-hint, html.ptr-busy .ptr-hint { color: #030303; }
.title { background: var(--green); color: var(--on-green); text-align: center; margin: 0; padding: 8px 10px 4px;
  font-size: clamp(34px, 11vw, 76px); line-height: 1; }
.sub { text-align: center; color: var(--gray); font-size: 14px; font-weight: 500; text-transform: uppercase; margin: 10px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

/* Barre jours + filtres (collante) */
.bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
/* 7 jours : bande défilante horizontalement sur téléphone, 7 colonnes sur ordinateur */
.days { display: flex; gap: 8px; padding: 10px 0 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
  margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-padding: 0 16px; }
.days::-webkit-scrollbar { display: none; }
.day { flex: 0 0 auto; min-width: 98px; scroll-snap-align: start; border: 1px solid var(--line); background: transparent; padding: 7px 6px 6px; text-align: center; text-transform: uppercase; line-height: 1.15; }
@media (min-width: 860px) { .days { display: grid; grid-template-columns: repeat(7, 1fr); margin: 0; padding-left: 0; padding-right: 0; overflow: visible; } .day { min-width: 0; } }
/* Interrupteur "Hors watchlist" */
.chip-toggle { display: inline-flex; align-items: center; gap: 7px; }
.chip-toggle .sw { width: 26px; height: 15px; border-radius: 999px; background: var(--hair); position: relative; transition: background .2s; flex: none; }
.chip-toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 2px #0004; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1); }
.chip-toggle[aria-pressed="true"] { background: var(--blue-pale); color: var(--elec-text); border-color: var(--elec-text); }
.chip-toggle[aria-pressed="true"] .sw { background: var(--blue); }
.chip-toggle[aria-pressed="true"] .sw::after { transform: translateX(11px); }
.day .dn { display: block; font-weight: 600; font-size: 13px; }
.day .dd { display: block; font-size: 11px; color: var(--gray); }
.day .dc { display: block; font-family: var(--display); font-weight: 900; font-stretch: 112%; font-size: 24px; color: var(--gray); margin-top: 3px; line-height: 1; }
.day .dc small { font-family: var(--sans); font-weight: 600; font-size: 11px; font-stretch: 100%; }
.day[aria-selected="true"] { background: var(--lime-grad); border-color: var(--lime-1); color: #030303; box-shadow: inset 0 -2px 0 #00000014; }
.day[aria-selected="true"] .dd, .day[aria-selected="true"] .dc { color: var(--on-green); }
.filters { display: flex; gap: 8px; padding: 0 0 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: transparent; padding: 6px 12px; font-size: 13px; font-weight: 500; text-transform: uppercase; color: var(--gray); }
.chip[aria-pressed="true"] { background: var(--lime-grad); color: #030303; border-color: var(--lime-1); }

/* En-têtes de colonnes comme le calendrier du site */
.cols { display: none; }
@media (min-width: 860px) {
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 16px; background: var(--lime-grad); color: var(--on-green); }
  .cols span { padding: 6px 12px; font-family: var(--display); font-weight: 900; font-stretch: 112%; font-size: 15px; text-transform: uppercase; }
  .cols span + span { border-left: 1px solid var(--line); }
}

/* Films */
.list { padding: 12px 0 28px; }
@media (min-width: 860px) { .list { padding-top: 0; } }
.film { border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 12px 0; }
.film:nth-child(odd) { background: var(--green-pale); }
.film { padding-left: 10px; padding-right: 10px; }
@media (min-width: 560px) { .film { grid-template-columns: 96px 1fr; } }
@media (min-width: 860px) {
  .film { grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr); gap: 0 14px; padding: 12px; }
  .film .seances { border-left: 1px solid var(--line); padding-left: 12px; }
}
.poster { display: block; aspect-ratio: 2/3; overflow: hidden; background: var(--hair); position: relative; align-self: start; }
.poster img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
.poster .ph { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 26px; color: var(--gray); }
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.badge { font-size: 10.5px; font-weight: 600; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--line); color: var(--gray); background: var(--bg); }
.badge.hot { background: var(--lime-grad); border-color: var(--lime-1); color: #030303; }
.film h2 { font-size: 16px; font-weight: 500; line-height: 1.25; margin: 0; }
.film h2 a { text-decoration: none; }
.film h2 i { font-style: italic; font-weight: 600; text-transform: uppercase; }
.film h2 a:hover i { text-decoration: underline; }
.orig { color: var(--gray); font-size: 13px; margin: 2px 0 0; }
.meta { color: var(--gray); font-size: 12.5px; text-transform: uppercase; margin: 6px 0 0; }
.th { padding: 9px 0 8px; border-top: 1px dotted var(--gray-t); }
@media (min-width: 860px) { .th:first-child { border-top: 0; padding-top: 0; } }
@media (max-width: 859px) { .seances { grid-column: 1 / -1; margin-top: 4px; } }
.th-name { display: block; background: none; border: 0; padding: 0; text-align: left; font-size: 14px; font-weight: 500; }
.th-name:hover { text-decoration: underline; }
.th-name sup { line-height: 0; }
.th-name .addr { display: block; font-weight: 400; font-size: 12px; color: var(--gray); }
.times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.t { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--bg); padding: 4px 9px; font-weight: 500; font-variant-numeric: tabular-nums; font-size: 14px; min-height: 34px; text-decoration: none; }
.t svg { width: 12px; height: 12px; color: var(--gray); }
.t:hover, .t:active { background: var(--lime-grad); border-color: var(--lime-1); color: #030303; }
#others .t:hover, #others .t:active { background: var(--elec); border-color: var(--elec); color: var(--on-elec); }
.t:hover svg, .t:active svg { color: #030303; }
#others .t:hover svg, #others .t:active svg { color: var(--on-elec); }
.t.past { color: var(--gray-t); border-color: var(--gray-t); text-decoration: line-through; }
.more { background: none; border: 0; padding: 6px 0 0; color: var(--gray); font-weight: 600; font-size: 12.5px; text-transform: uppercase; text-decoration: underline; }
.film:not(.expanded) .th.extra { display: none; }
.film.expanded .more { display: none; }
/* Section "Aussi à l'affiche" : plus compacte, sans affiche, rayures bleu pâle */
.others-head { position: relative; overflow: hidden; background: var(--elec-grad); color: var(--on-elec); padding: 10px 12px 9px; margin-top: 8px; }
.others-head::after { content: ""; position: absolute; right: -6px; top: 50%; width: 92px; height: 72px; transform: translateY(-50%) rotate(-8deg);
  background: url("logo.svg") center / contain no-repeat; opacity: .28; pointer-events: none; }
.others-head h2, .others-head p { position: relative; z-index: 1; }
.others-head h2 { margin: 0; font-size: 22px; line-height: 1; color: var(--on-elec); }
.others-head p { margin: 4px 0 0; padding-right: 72px; font-size: 12px; text-transform: uppercase; font-weight: 500; color: #ffffffcc; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; padding: 12px 0 28px; }
@media (min-width: 560px) { .pgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 860px) { .pgrid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 12px; } }
.tile { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .poster { width: 100%; border: 1px solid transparent; }
.tile[aria-expanded="true"] .poster { outline: 3px solid var(--blue); outline-offset: 2px; }
/* Fausse affiche quand aucune image n'existe : style Rétro Projecteur */
.tile .ph-title { display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; gap: 6px;
  background: #fff; color: #030303; border: 1px solid #6a6a6d; padding: 0 0 8px; text-align: center; overflow: hidden; }
.tile .pt-band { background: var(--elec-grad); color: #fff; font-family: var(--display); font-weight: 900; font-stretch: 112%; font-size: 15px; padding: 4px 0 2px; }
.tile .pt-name { font-family: var(--display); font-weight: 900; font-stretch: 105%; text-transform: uppercase; font-size: 14px; line-height: 1.05;
  padding: 0 6px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.tile .pt-dir { font-size: 10px; color: #6a6a6d; text-transform: uppercase; padding: 0 6px; line-height: 1.2;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .tt { font-size: 12px; font-weight: 600; font-style: italic; text-transform: uppercase; line-height: 1.2;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .ty { font-size: 11px; color: var(--gray); margin-top: -2px; }
/* Groupes "Déjà vus / Pour toi / Le reste" et badges sur les affiches */
.ogroup { margin-top: 18px; border-bottom: 1px solid var(--elec-text); padding-bottom: 6px; }
.ogroup h3 { margin: 0; font-family: var(--display); font-weight: 900; font-stretch: 112%; font-size: 18px; text-transform: uppercase; color: var(--elec-text); }
.ogroup h3 span { font-family: var(--sans); font-size: 12px; font-weight: 600; background: var(--blue-pale); color: var(--elec-text); padding: 1px 7px; vertical-align: 3px; margin-left: 4px; }
.ogroup p { margin: 2px 0 0; font-size: 12px; color: var(--gray); text-transform: uppercase; }
.ogroup + .pgrid { padding-top: 10px; }
.pbadge { position: absolute; z-index: 2; left: 4px; top: 4px; font-size: 10.5px; font-weight: 700; padding: 2px 5px; text-transform: uppercase;
  font-variant-numeric: tabular-nums; box-shadow: 0 1px 3px #0004; letter-spacing: .02em; }
.pbadge.seen { background: var(--elec); color: #fff; }
.pbadge.match { background: #fff; color: #0033FF; border: 1px solid #0033FF; }
.pbadge.match.hot { background: #DCE3FF; border-color: #0033FF; color: #0033FF; }
.detail .taste { margin: 6px 0 0; font-size: 13px; }
.detail .taste b { font-weight: 700; }
.detail .taste.seen b { background: var(--elec); color: #fff; padding: 0 4px; }
.detail { grid-column: 1 / -1; background: var(--blue-pale); border: 1px solid var(--line); padding: 12px; }
.detail-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.detail h3 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.25; }
.detail h3 a { text-decoration: none; }
.detail h3 i { font-weight: 600; text-transform: uppercase; }
.detail-close { flex: none; background: none; border: 1px solid var(--line); width: 30px; height: 30px; font-size: 14px; }
.detail .meta { margin: 4px 0 6px; }
.detail .meta a { color: var(--gray); }
.detail .th:first-child { border-top: 0; }
.detail:not(.expanded) .th.extra { display: none; }
.detail.expanded .more { display: none; }
.empty { text-align: center; color: var(--gray); padding: 48px 12px; }
.empty b { display: block; font-family: var(--display); font-weight: 900; font-stretch: 112%; font-size: 28px; text-transform: uppercase; margin-bottom: 4px; }
footer { color: var(--gray); font-size: 12px; text-transform: uppercase; padding: 0 0 calc(28px + env(safe-area-inset-bottom)); }

/* --- Animations (désactivées si "Réduire les animations" est activé sur l'appareil) --- */
.bar { transition: box-shadow .3s ease; }
.bar.scrolled { box-shadow: 0 10px 24px -18px #0007; }
@media (prefers-reduced-motion: no-preference) {
  :root { --ease: cubic-bezier(.2, .75, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); }

  /* Ouverture : le titre se dévoile, le reste suit */
  .logo { animation: logoIn 1.1s var(--ease) backwards; }
  @keyframes logoIn { 0% { opacity: 0; transform: translateY(-12px) rotateY(-180deg) scale(.85); } 60% { opacity: 1; } 100% { transform: none; } }
  .kicker, .sub { animation: rise .7s var(--ease) both; }
  .sub { animation-delay: .25s; }
  .bar { animation: rise .7s .35s var(--ease) both; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  /* Entrée en cascade au défilement */
  .reveal { opacity: 0; transform: translateY(16px); }
  .reveal.in { opacity: 1; transform: none;
    transition: opacity .55s var(--ease) var(--d, 0ms), transform .6s var(--ease) var(--d, 0ms); }

  /* Changement de jour */
  main { transition: opacity .17s ease, transform .17s ease; }
  main.leaving { opacity: 0; transform: translateY(6px); }
  .day[aria-selected="true"] { animation: pop .45s var(--spring); }
  @keyframes pop { 0% { transform: scale(.94); } 100% { transform: scale(1); } }

  /* Affiches : fondu + léger dézoom une fois chargées */
  .poster img { opacity: 0; transform: scale(1.06); transition: opacity .5s ease, transform .9s var(--ease); }
  .poster img.ok { opacity: 1; transform: none; }

  /* Retour au toucher */
  .day, .chip, .t, .more, .th-name, .detail-close { transition: background-color .2s, color .2s, border-color .2s, transform .18s var(--ease); }
  .day:active, .chip:active, .t:active, .detail-close:active { transform: scale(.94); }
  .tile { transition: transform .25s var(--ease); }
  .tile:active { transform: scale(.95); }
  .tile .poster { transition: transform .35s var(--ease), box-shadow .35s var(--ease), outline-color .2s; }
  @media (hover: hover) {
    .tile:hover .poster { transform: translateY(-4px); box-shadow: 0 14px 24px -14px #0008; }
    .film .poster { transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
    .film:hover .poster { transform: translateY(-3px) rotate(-.6deg); box-shadow: 0 14px 24px -14px #0008; }
  }

  /* Panneau d'une affiche : se déplie, puis les salles apparaissent une à une */
  .detail { animation: unfold .45s var(--ease) both; transform-origin: top center; }
  @keyframes unfold { from { opacity: 0; transform: translateY(-10px) scaleY(.92); clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  .detail .th, .film.expanded .th.extra { animation: rise .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 120ms); }
  .film.expanded .th.extra { animation-delay: calc((var(--i, 0) - 3) * 45ms); }
}
</style>
</head>
<body>
<div class="ptr-sky" aria-hidden="true"></div>
<div class="ptr-hint" id="ptr-hint" aria-hidden="true">Tire pour actualiser</div>
<div id="app">
<header class="masthead wrap">
  <h1 class="logo-wrap"><span class="sr">Watchlist</span>

</header>

<div class="bar">
  <div class="wrap">
    <nav class="days" id="days" role="tablist" aria-label="Jour"></nav>
    <div class="filters" id="filters" aria-label="Filtres">
      <button class="chip chip-toggle" id="others-toggle" aria-pressed="true"><span class="sw" aria-hidden="true"></span>Hors watchlist</button>
      <span class="sep"></span>
      <button class="chip" data-bank="all" aria-pressed="true">Partout</button>
      <button class="chip" data-bank="rg" aria-pressed="false">Rive gauche</button>
      <button class="chip" data-bank="rd" aria-pressed="false">Rive droite</button>
      <button class="chip" id="classics" aria-pressed="false">Ressorties seulement</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="cols"><span>Films</span><span>Séances</span></div>
  <div class="list" id="list"></div>
  <section id="others" aria-label="Autres films à l'affiche"></section>
</main>
<footer class="wrap" id="foot"></footer>
</div>


<script>
const DATA = /*__DATA__*/null;
// Relais Cloudflare qui relance la mise à jour au "tirer pour actualiser" (vide = simple rechargement)
const REFRESH_URL = 'https://watchlist-refresh.doriansublon.workers.dev/';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const hm = (t) => { let h = Math.floor(t), m = Math.round((t - h) * 60); if (m === 60) { h++; m = 0; } return [h, m]; };
const fmtTime = (t) => { const [h, m] = hm(t); return `${h}h${pad(m)}`; };
const parseDay = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fr = (d, o) => d.toLocaleDateString('fr-FR', o);
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const thisYear = new Date().getFullYear();

// "75005" -> 5<sup>e</sup>, "75001" -> 1<sup>er</sup>, "75116" -> 16<sup>e</sup>, banlieue -> code postal
function arr(zip) {
  if (!zip) return '';
  const m = /^751(\d\d)$|^750(\d\d)$/.exec(zip);
  if (!m) return esc(zip);
  const n = Number(m[1] ? 16 : m[2]);
  return n === 1 ? '1<sup>er</sup>' : `${n}<sup>e</sup>`;
}

const state = { day: null, bank: 'all', classics: false, showOthers: true };
try { state.showOthers = localStorage.getItem('showOthers') !== '0'; } catch {}
const films = DATA.films || [];
films.forEach((f) => { f.total = f.seances.reduce((n, s) => n + s.times.length, 0); });

function isPast(iso, t) { const [h, m] = hm(t); const d = parseDay(iso); d.setHours(h, m); return d < new Date(); }

const others = DATA.others || [];
others.forEach((f) => { f.total = f.seances.reduce((n, s) => n + s.times.length, 0); });

function filmsFor(iso, src = films) {
  return src.map((f) => ({ f, seances: f.seances.filter((s) => s.date === iso && (state.bank === 'all' || s.bank === state.bank)) }))
    .filter(({ f, seances }) => seances.length && (!state.classics || (f.year && f.year <= thisYear - 2)))
    .map((x) => { const up = x.seances.flatMap((s) => s.times.filter((t) => !isPast(iso, t))); x.next = up.length ? Math.min(...up) : 99; return x; })
    .sort((a, b) => a.next - b.next);
}

function dayLabel(iso) {
  const d = parseDay(iso), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((d - today) / 864e5);
  return { name: diff === 0 ? "Aujourd'hui" : diff === 1 ? 'Demain' : fr(d, { weekday: 'long' }), date: fr(d, { weekday: diff <= 1 ? 'short' : undefined, day: 'numeric', month: 'short' }) };
}

// 7 jours glissants : on ne montre jamais les jours déjà passés (la page peut dater de la veille)
const todayIso = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
const DAYS = DATA.days.filter((d) => d >= todayIso).length ? DATA.days.filter((d) => d >= todayIso) : DATA.days;

function renderDays() {
  $('#days').innerHTML = DAYS.map((iso) => {
    const { name, date } = dayLabel(iso), n = filmsFor(iso).length;
    return `<button class="day" role="tab" data-day="${iso}" aria-selected="${iso === state.day}">
      <span class="dn">${esc(name)}</span><span class="dd">${esc(date)}</span><span class="dc">${n}<small> film${n > 1 ? 's' : ''}</small></span></button>`;
  }).join('');
  // Onglet choisi bien visible dans la bande défilante (sans faire bouger la page verticalement)
  const strip = $('#days'), sel = strip.querySelector('[aria-selected="true"]');
  if (sel && strip.scrollWidth > strip.clientWidth) {
    const target = sel.offsetLeft - (strip.clientWidth - sel.offsetWidth) / 2;
    strip.scrollTo({ left: Math.max(0, target), behavior: calm.matches ? 'auto' : 'smooth' });
  }
}

let othersShown = [];

function renderList() {
  const list = filmsFor(state.day);
  $('#list').innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty"><b>Relâche</b>Aucun film de ta watchlist ce jour-là${state.bank !== 'all' || state.classics ? ' avec ces filtres' : ''}.</div>`;

  // Autres films : grille d'affiches compacte ; toucher une affiche déplie où et quand il passe.
  // Ordre : ressorties d'abord (par année, comme le calendrier du Rétro Projecteur), puis nouveautés.
  // Masquable avec le filtre "Hors watchlist".
  if (!state.showOthers) { othersShown = []; $('#others').innerHTML = ''; return; }
  // Tri "pour toi" : 1) déjà vus, par ta note ; 2) pas vus, du plus au moins probable de te plaire ;
  // 3) films sans fiche Letterboxd (impossible à évaluer), par année.
  const groupOf = (f) => (f.seen ? 0 : f.match != null ? 1 : 2);
  const seenScore = (f) => (f.seen.r ?? 0) + (f.seen.liked ? 0.1 : 0);
  othersShown = filmsFor(state.day, others).filter((x) => x.next !== 99).sort((a, b) => {
    const ga = groupOf(a.f), gb = groupOf(b.f);
    if (ga !== gb) return ga - gb;
    if (ga === 0) return seenScore(b.f) - seenScore(a.f);
    if (ga === 1) return b.f.match - a.f.match;
    return (a.f.year || 9999) - (b.f.year || 9999) || a.f.title.localeCompare(b.f.title, 'fr');
  });
  const n = othersShown.length;
  const groups = [
    { g: 0, title: 'Déjà vus', sub: 'triés par ta note' },
    { g: 1, title: 'Pour toi', sub: 'du plus probable au moins probable de te plaire, d’après tes notes Letterboxd' },
    { g: 2, title: 'Le reste', sub: 'pas de fiche Letterboxd pour les évaluer' },
  ];
  $('#others').innerHTML = n ? `
    <div class="others-head"><h2 class="display">Aussi à l'affiche</h2>
      <p>${n} autre${n > 1 ? 's' : ''} film${n > 1 ? 's' : ''} hors de ta watchlist · trié pour toi · touche une affiche pour voir les séances</p></div>
    ${groups.map(({ g, title, sub }) => {
      const items = othersShown.map((x, i) => ({ x, i })).filter(({ x }) => groupOf(x.f) === g);
      return items.length ? `<div class="ogroup"><h3>${title} <span>${items.length}</span></h3><p>${sub}</p></div>
        <div class="pgrid">${items.map(({ x, i }) => tile(x, i)).join('')}</div>` : '';
    }).join('')}` : '';
}

// ★ en demi-étoiles : 4.5 -> "★4½"
const starTxt = (r) => r == null ? '' : `★${Math.floor(r)}${r % 1 ? '½' : ''}`;

const lbUrl = (f) => f.slug ? `https://letterboxd.com/film/${esc(f.slug)}/` : `https://letterboxd.com/search/films/${encodeURIComponent(f.original || f.title)}/`;
const metaOf = (f) => [f.runtime ? `${f.runtime} min` : null,
  f.countries ? esc(f.countries.split(/,\s*/).slice(0, 2).join(', ') + (f.countries.split(',').length > 2 ? '…' : '')) : null,
  f.rating ? `★ ${f.rating.toFixed(1).replace('.', ',')}` : null].filter(Boolean).join(' · ');
const posterImg = (f) => (f.poster || f.still)
  ? `<img src="${esc(f.poster || f.still)}" alt="" loading="lazy" referrerpolicy="no-referrer" ${f.poster && f.still ? `data-still="${esc(f.still)}"` : ''} onload="this.classList.add('ok')" onerror="if(this.dataset.still){this.src=this.dataset.still;delete this.dataset.still}else{this.remove()}">` : '';

// Salles + horaires (chaque horaire = fichier calendrier) ; au-delà de `max` salles, repliées
function theatersHtml(f, seances, max) {
  const nextOf = (s) => Math.min(...s.times.filter((t) => !isPast(s.date, t)), 99);
  const sorted = [...seances].sort((a, b) => nextOf(a) - nextOf(b) || Math.min(...a.times) - Math.min(...b.times));
  const extra = sorted.length - max;
  return sorted.map((s, i) => `
    <div class="th${i >= max ? ' extra' : ''}" style="--i:${i}">
      <button class="th-name" data-map="${esc(s.theater)}|${esc(s.address || s.zip)}">${esc(s.theater)} (${arr(s.zip)})${s.address ? `<span class="addr">${esc(s.address)}</span>` : ''}</button>
      <div class="times">${s.times.map((t, k) => `<a class="t${isPast(s.date, t) ? ' past' : ''}" href="ics/${encodeURIComponent((s.ics || [])[k] || '')}" target="_blank" rel="noopener" aria-label="Ajouter ${esc(f.title)} à ${fmtTime(t)} à mon calendrier">${cal}${fmtTime(t)}</a>`).join('')}</div>
    </div>`).join('') + (extra > 0 ? `<button class="more">+ ${extra} autre${extra > 1 ? 's' : ''} salle${extra > 1 ? 's' : ''}</button>` : '');
}

function card({ f, seances }) {
  const badges = [];
  if (f.total === 1) badges.push('<span class="badge hot">Séance unique</span>');
  else if (f.total <= 3) badges.push('<span class="badge hot">Rare</span>');
  badges.push(`<span class="badge">${f.year && f.year <= thisYear - 2 ? 'Ressortie' : 'Nouveauté'}</span>`);
  const meta = metaOf(f);
  const initials = esc((f.title || '?').split(/\s+/).slice(0, 2).map((w) => w[0]).join(''));
  return `<article class="film">
    <a class="poster" href="${lbUrl(f)}" target="_blank" rel="noopener" aria-label="${esc(f.title)} sur Letterboxd"><span class="ph">${initials}</span>${posterImg(f)}</a>
    <div>
      <div class="badges">${badges.join('')}</div>
      <h2><a href="https://leretroprojecteur.com/film/${esc(f.id)}" target="_blank" rel="noopener"><i>${esc(f.title)}</i>, ${esc(f.directors)} (${f.year || '?'})</a></h2>
      ${f.original && f.original.toLowerCase() !== f.title.toLowerCase() ? `<p class="orig">${esc(f.original)}</p>` : ''}
      ${meta ? `<p class="meta">${meta}</p>` : ''}
    </div>
    <div class="seances">${theatersHtml(f, seances, 3)}</div>
  </article>`;
}

// Vignette d'affiche (section "Aussi à l'affiche")
// Badge sur l'affiche : "VU ★4½" (déjà vu) ou "87 %" (probabilité que ça te plaise)
function badgeOf(f) {
  if (f.seen) return `<span class="pbadge seen">Vu${f.seen.r != null ? ' ' + starTxt(f.seen.r) : ''}${f.seen.liked ? ' ♥' : ''}</span>`;
  if (f.match != null) return `<span class="pbadge match${f.match >= 75 ? ' hot' : ''}">${f.match} %</span>`;
  return '';
}

function tile({ f }, i) {
  return `<button class="tile" data-i="${i}" aria-expanded="false">
    <span class="poster"><span class="ph ph-title"><span class="pt-band">${f.year || ''}</span><span class="pt-name">${esc(f.title)}</span><span class="pt-dir">${esc(f.directors || '')}</span></span>${posterImg(f)}${badgeOf(f)}</span>
    <span class="tt">${esc(f.title)}</span><span class="ty">${f.year || ''}</span>
  </button>`;
}

// Déplie, sous la rangée de l'affiche touchée, le détail du film : pourquoi ce score, salles et horaires
function toggleDetail(tileEl) {
  const wasOpen = tileEl.getAttribute('aria-expanded') === 'true';
  document.querySelectorAll('#others .detail').forEach((d) => d.remove());
  document.querySelectorAll('#others .tile[aria-expanded="true"]').forEach((t) => t.setAttribute('aria-expanded', 'false'));
  if (wasOpen) return;
  const grid = tileEl.closest('.pgrid');
  const tiles = [...grid.querySelectorAll('.tile')];
  const i = tiles.indexOf(tileEl);
  const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  const last = Math.min(Math.floor(i / cols) * cols + cols - 1, tiles.length - 1);
  const { f, seances } = othersShown[Number(tileEl.dataset.i)];
  const meta = metaOf(f);
  const taste = f.seen
    ? `<p class="taste seen">Tu l'as déjà vu${f.seen.r != null ? ` · ta note : <b>${starTxt(f.seen.r)}</b>` : ''}${f.seen.liked ? ' · ♥ coup de cœur' : ''}</p>`
    : f.match != null
      ? `<p class="taste"><b>${f.match} % pour toi</b> (≈ ${String(f.pred).replace('.', ',')}★)${f.why ? ` · ${esc(f.why)}` : ''}</p>`
      : '';
  const d = document.createElement('div');
  d.className = 'detail';
  d.innerHTML = `
    <div class="detail-head">
      <h3><a href="https://leretroprojecteur.com/film/${esc(f.id)}" target="_blank" rel="noopener"><i>${esc(f.title)}</i>, ${esc(f.directors)} (${f.year || '?'})</a></h3>
      <button class="detail-close" aria-label="Fermer">✕</button>
    </div>
    ${taste}
    <p class="meta">${meta ? meta + ' · ' : ''}<a href="${lbUrl(f)}" target="_blank" rel="noopener">Letterboxd ↗</a></p>
    <div class="seances">${theatersHtml(f, seances, 99)}</div>`;
  tiles[last].after(d);
  tileEl.setAttribute('aria-expanded', 'true');
  d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

const cal = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="5" width="18" height="16"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>';

// --- Animations -----------------------------------------------------------------
const calm = matchMedia('(prefers-reduced-motion: reduce)');

// Cartes et affiches qui montent en place, en cascade, quand elles entrent à l'écran
const revealIO = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
  let k = 0;
  entries.filter((e) => e.isIntersecting).forEach((e) => {
    e.target.style.setProperty('--d', `${Math.min(k++, 8) * 55}ms`);
    e.target.classList.add('in');
    revealIO.unobserve(e.target);
  });
}, { rootMargin: '0px 0px -6% 0px' }) : null;

function animateIn() {
  // Affiches déjà en cache : afficher sans attendre l'événement load
  document.querySelectorAll('.poster img').forEach((img) => { if (img.complete && img.naturalWidth) img.classList.add('ok'); });
  if (calm.matches || !revealIO) return;
  document.querySelectorAll('.film, .tile, .empty, .others-head, .ogroup').forEach((el) => { el.classList.add('reveal'); revealIO.observe(el); });
}

function render() { renderDays(); renderList(); animateIn(); }

// Changement de jour : la liste s'efface puis la nouvelle arrive en cascade
function switchDay(iso) {
  if (iso === state.day) return;
  state.day = iso;
  try { sessionStorage.setItem('day', iso); } catch {}
  const main = $('main');
  const go = () => {
    render();
    main.classList.remove('leaving');
    // On remonte en haut de la liste des films (juste sous la barre des jours, qui reste collée en haut)
    const listTop = Math.max(0, main.getBoundingClientRect().top + scrollY - $('.bar').offsetHeight - 6);
    if (scrollY > listTop) window.scrollTo({ top: listTop, behavior: calm.matches ? 'auto' : 'smooth' });
  };
  if (calm.matches) return go();
  renderDays();                      // l'onglet bascule tout de suite (petit rebond)
  main.classList.add('leaving');
  setTimeout(go, 170);
}

// Ombre sous la barre des jours dès qu'on fait défiler
addEventListener('scroll', () => { $('.bar').classList.toggle('scrolled', scrollY > $('.bar').offsetTop + 2); }, { passive: true });

const mapUrl = (name, addr) => {
  const q = encodeURIComponent(/paris/i.test(addr) ? `${name}, ${addr}` : `${name} cinéma ${addr || ""} Paris`);
  return isIOS ? `https://maps.apple.com/?q=${q}` : `https://www.google.com/maps/search/?api=1&query=${q}`;
};

document.addEventListener('click', (e) => {
  const day = e.target.closest('.day');
  if (day) { switchDay(day.dataset.day); return; }
  const bank = e.target.closest('[data-bank]');
  if (bank) { state.bank = bank.dataset.bank; document.querySelectorAll('[data-bank]').forEach((b) => b.setAttribute('aria-pressed', b === bank)); render(); return; }
  if (e.target.closest('#classics')) { state.classics = !state.classics; $('#classics').setAttribute('aria-pressed', state.classics); render(); return; }
  if (e.target.closest('#others-toggle')) {
    state.showOthers = !state.showOthers;
    $('#others-toggle').setAttribute('aria-pressed', state.showOthers);
    try { localStorage.setItem('showOthers', state.showOthers ? '1' : '0'); } catch {}
    renderList(); animateIn();
    if (state.showOthers) $('#others .others-head')?.scrollIntoView({ block: 'nearest', behavior: calm.matches ? 'auto' : 'smooth' });
    return;
  }
  const th = e.target.closest('.th-name');
  if (th) { const [n, z] = th.dataset.map.split('|'); window.open(mapUrl(n, z), '_blank', 'noopener'); return; }
  const more = e.target.closest('.more');
  if (more) { more.closest('.film, .detail').classList.add('expanded'); return; }
  const tl = e.target.closest('.tile');
  if (tl) { toggleDetail(tl); return; }
  if (e.target.closest('.detail-close')) { const open = $('.tile[aria-expanded="true"]'); if (open) toggleDetail(open); }
});

const gen = new Date(DATA.generated);
const nWeek = films.filter((f) => f.seances.some((s) => DAYS.includes(s.date))).length;
$('#sub').textContent = `${nWeek} film${nWeek > 1 ? 's' : ''} de ta watchlist à l'affiche · du ${fr(parseDay(DAYS[0]), { day: 'numeric', month: 'long' })} au ${fr(parseDay(DAYS.at(-1)), { day: 'numeric', month: 'long' })}`;
$('#foot').textContent = `Mis à jour le ${fr(gen, { weekday: 'long', day: 'numeric', month: 'long' })} à ${pad(gen.getHours())}h${pad(gen.getMinutes())} · ${DATA.watchlistCount} films dans la watchlist de ${DATA.user}`;
$('#others-toggle').setAttribute('aria-pressed', state.showOthers);
let saved = null; try { saved = sessionStorage.getItem('day'); } catch {}
state.day = DAYS.includes(saved) ? saved : DAYS.includes(todayIso) ? todayIso : DAYS[0];
render();

// --- Tirer pour actualiser : la page descend, le W tourne au rythme du doigt ----------
// Performance : un seul conteneur (#app) est déplacé, en translate3d (calculé par la carte graphique),
// et au plus une mise à jour par image affichée (requestAnimationFrame). Aucun recalcul de style de la page.
(() => {
  const root = document.documentElement, app = $('#app'), logo = $('#logo'), hint = $('#ptr-hint'), sky = $('.ptr-sky');
  const anim = (on) => { app.classList.toggle('ptr-anim', on); sky.classList.toggle('ptr-anim', on); };
  const TH = 80;                       // distance (après résistance) pour déclencher l'actualisation
  let y0 = null, pull = 0, active = false, frame = 0, next = null;
  const apply = () => {
    frame = 0;
    if (!next) return;
    const [p, deg] = next; next = null;
    app.style.transform = p ? `translate3d(0, ${p}px, 0)` : '';
    sky.style.transform = `scaleY(${p / 140 + (p ? 0.12 : 0)})`;   // léger débord : pas de liseré sous l'arrondi
    logo.style.transform = deg ? `rotateY(${deg}deg)` : '';
  };
  const set = (p, deg, now) => {
    next = [p, deg];
    if (now) { if (frame) cancelAnimationFrame(frame); apply(); }
    else if (!frame) frame = requestAnimationFrame(apply);
  };
  const setState = (cls, on) => { if (root.classList.contains(cls) !== on) root.classList.toggle(cls, on); };
  const reset = () => {
    anim(false); app.classList.remove('ptr-live');
    setState('ptr-ready', false); setState('ptr-pulling', false);
    set(0, 0, true);
    hint.textContent = 'Tire pour actualiser';
  };
  addEventListener('touchstart', (e) => {
    if (scrollY > 0 || e.touches.length > 1 || root.classList.contains('ptr-busy')) return;
    y0 = e.touches[0].clientY; active = false; pull = 0;
  }, { passive: true });
  addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (!active) {
      if (dy < 0 || scrollY > 0) { y0 = null; return; }   // geste vers le haut : défilement normal
      if (dy <= 6) return;
      active = true;
      anim(false); app.classList.add('ptr-live');
      setState('ptr-pulling', true);
    }
    if (e.cancelable) e.preventDefault();               // on garde la main sur le geste
    pull = Math.max(0, Math.min(140, (dy - 6) * 0.5));  // résistance élastique
    set(pull, (pull / TH) * 360);                       // un tour complet au seuil
    const ready = pull >= TH;
    if (ready !== root.classList.contains('ptr-ready')) {
      setState('ptr-ready', ready);
      hint.textContent = ready ? 'Relâche pour actualiser' : 'Tire pour actualiser';
    }
  }, { passive: false });
  const end = () => {
    if (y0 == null) return;
    y0 = null;
    if (!active) return;
    active = false;
    const deg = (pull / TH) * 360;
    anim(true);
    if (pull >= TH) {
      // Actualisation : le W enchaîne deux tours en restant un peu descendu, pendant qu'on relance la mise à jour
      setState('ptr-busy', true);
      hint.textContent = 'Actualisation…';
      set(58, Math.ceil(deg / 360) * 360 + 720, true);
      refresh();
    } else {
      // Relâché trop tôt : le W finit son tour (comme une toupie) en remontant
      setState('ptr-pulling', false);
      set(0, Math.ceil(deg / 360) * 360, true);
      setTimeout(reset, 720);
    }
    pull = 0;
  };
  addEventListener('touchend', end);
  addEventListener('touchcancel', end);

  // Relance réelle : le relais Cloudflare déclenche le workflow GitHub (relit watchlist + séances),
  // puis on guette la nouvelle version publiée et on recharge. Sans relais : simple rechargement.
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const say = (t) => { hint.textContent = t; };
  const published = async () => {
    try {
      const html = await (await fetch(`./?v=${Date.now()}`, { cache: 'no-store' })).text();
      return (html.match(/"generated":"([^"]+)"/) || [])[1];
    } catch { return null; }
  };
  const spin = () => setTimeout(() => { setState('ptr-wait', true); logo.style.transform = ''; }, 1000);
  async function refresh() {
    const t0 = Date.now();
    let state = null;
    if (REFRESH_URL) {
      try { state = (await (await fetch(REFRESH_URL, { method: 'POST' })).json()).state; } catch {}
    }
    if (state !== 'started' && state !== 'running') {
      // Pas de relais, ou mise à jour toute fraîche (< 10 min) : la page publiée est déjà la bonne
      if (state === 'fresh') say('Déjà à jour');
      await wait(Math.max(0, 900 - (Date.now() - t0)));
      return location.reload();
    }
    say('Mise à jour en cours…');
    spin();
    const limit = t0 + 8 * 60e3;
    while (Date.now() < limit) {
      await wait(10e3);
      const g = await published();
      if (g && g !== DATA.generated) { say('C’est à jour !'); await wait(600); return location.reload(); }
    }
    // Trop long : on rend la main, la page se mettra à jour toute seule au prochain passage
    say('Toujours en cours, réessaie plus tard');
    await wait(2500);
    setState('ptr-wait', false); setState('ptr-busy', false); setState('ptr-pulling', false);
    set(0, 0, true);
    setTimeout(reset, 600);
  }
})();
</script>
</body>
</html>
